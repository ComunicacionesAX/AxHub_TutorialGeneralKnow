<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoriales | Asimetrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ax-brand-primary: #006084;
            --ax-brand-primary-hover: #00547A;
            --ax-brand-primary-pressed: #00415F;
            --ax-brand-primary-soft: #E5EFF3;
            --ax-fg-1: #0A0F3D;
            --ax-fg-2: #4A5566;
            --ax-fg-3: #6C7878;
            --ax-fg-disabled: #B4BDC4;
            --ax-bg-1: #FFFFFF;
            --ax-bg-2: #F5F6F8;
            --ax-bg-3: #ECEEF1;
            --ax-border: #D8DCE0;
            --ax-border-strong: #B4BDC4;
            --ax-focus-ring: rgba(0,96,132,.15);
            --ax-shadow-xs: 0 1px 2px rgba(10,15,61,.06);
            --ax-shadow-sm: 0 2px 4px rgba(10,15,61,.08);
            --ax-shadow-md: 0 4px 12px rgba(10,15,61,.10);
            --ax-shadow-lg: 0 12px 24px rgba(10,15,61,.12);
            --ax-shadow-xl: 0 24px 48px rgba(10,15,61,.16);
            --ax-dark-bg-1: #0A0F3D;
            --ax-dark-bg-2: #111A52;
            --ax-dark-bg-3: #1B2566;
            --ax-dark-fg-1: #FFFFFF;
            --ax-dark-fg-2: #C7CCE0;
            --ax-dark-fg-3: #8C92AD;
            --ax-dark-border: #2A3270;
            --ax-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
            --ax-dur-fast: 120ms;
            --ax-dur-base: 200ms;
            --ax-dur-slow: 320ms;
            --sidebar-width: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 22px;
            letter-spacing: -0.3px;
            color: var(--ax-fg-1);
            background: var(--ax-bg-2);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--ax-dark-bg-1);
            color: var(--ax-dark-fg-2);
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--ax-dark-border);
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 700;
            line-height: 23px;
            letter-spacing: -0.3px;
            color: var(--ax-dark-fg-1);
        }

        .sidebar-header p {
            font-size: 12px;
            line-height: 16px;
            letter-spacing: -0.17px;
            color: var(--ax-dark-fg-3);
            margin-top: 4px;
        }

        .sidebar-nav {
            padding: 12px 0;
            flex: 1;
        }

        .nav-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            line-height: 16px;
            letter-spacing: 1.8px;
            color: var(--ax-dark-fg-3);
            text-transform: uppercase;
            transition: background var(--ax-dur-fast) var(--ax-ease), color var(--ax-dur-fast) var(--ax-ease);
            user-select: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-section-header:hover {
            background: rgba(255,255,255,.08);
            color: var(--ax-dark-fg-1);
        }

        .nav-section-header .icon {
            font-size: 18px;
            transition: transform var(--ax-dur-base) var(--ax-ease);
        }

        .nav-section-header .icon.open {
            transform: rotate(90deg);
        }

        .nav-subsection {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--ax-dur-slow) var(--ax-ease);
        }

        .nav-subsection.open {
            max-height: 2000px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px 8px 40px;
            color: var(--ax-dark-fg-2);
            text-decoration: none;
            font-size: 14px;
            line-height: 18px;
            letter-spacing: -0.2px;
            font-weight: 400;
            transition: background var(--ax-dur-fast) var(--ax-ease), color var(--ax-dur-fast) var(--ax-ease);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-link:hover {
            background: rgba(255,255,255,.08);
            color: var(--ax-dark-fg-1);
        }

        .nav-link.active {
            color: var(--ax-dark-fg-1);
            background: rgba(0,96,132,.25);
            border-right: 3px solid var(--ax-brand-primary);
            font-weight: 500;
        }

        .nav-simple-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            color: var(--ax-dark-fg-2);
            text-decoration: none;
            font-size: 14px;
            line-height: 18px;
            letter-spacing: -0.2px;
            font-weight: 500;
            transition: background var(--ax-dur-fast) var(--ax-ease), color var(--ax-dur-fast) var(--ax-ease);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-simple-link:hover {
            background: rgba(255,255,255,.08);
            color: var(--ax-dark-fg-1);
        }

        .nav-simple-link.active {
            color: var(--ax-dark-fg-1);
            background: rgba(0,96,132,.25);
            border-right: 3px solid var(--ax-brand-primary);
        }

        .main {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px 48px;
            min-height: 100vh;
        }

        .main-header {
            margin-bottom: 32px;
        }

        .main-header h1 {
            font-size: 40px;
            line-height: 40px;
            letter-spacing: -0.6px;
            font-weight: 700;
            color: var(--ax-fg-1);
        }

        .main-header p {
            color: var(--ax-fg-2);
            margin-top: 8px;
            max-width: 700px;
            font-size: 16px;
            line-height: 22px;
            letter-spacing: -0.3px;
        }

        .tutorial-content {
            background: var(--ax-bg-1);
            border-radius: 12px;
            padding: 32px;
            box-shadow: var(--ax-shadow-sm);
            border: 1px solid var(--ax-border);
            min-height: 400px;
        }

        .tutorial-content h2 {
            font-size: 24px;
            line-height: 26px;
            letter-spacing: -0.45px;
            font-weight: 700;
            color: var(--ax-fg-1);
            margin-bottom: 16px;
        }

        .tutorial-content p {
            color: var(--ax-fg-2);
            margin-bottom: 16px;
            line-height: 22px;
            letter-spacing: -0.3px;
        }

        .tutorial-content .info-box {
            background: var(--ax-brand-primary-soft);
            border-left: 4px solid var(--ax-brand-primary);
            padding: 16px 20px;
            border-radius: 6px;
            margin-bottom: 24px;
        }

        .tutorial-content .info-box h4 {
            font-size: 14px;
            line-height: 18px;
            letter-spacing: -0.2px;
            font-weight: 700;
            color: var(--ax-brand-primary);
            margin-bottom: 4px;
        }

        .tutorial-content .info-box p {
            margin-bottom: 0;
            font-size: 14px;
            line-height: 18px;
            letter-spacing: -0.2px;
        }

        .tutorial-content .step-list {
            list-style: none;
            padding: 0;
        }

        .tutorial-content .step-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ax-border);
        }

        .tutorial-content .step-list li:last-child {
            border-bottom: none;
        }

        .tutorial-content .step-list .step-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: var(--ax-brand-primary);
            color: #fff;
            font-size: 12px;
            line-height: 16px;
            letter-spacing: -0.17px;
            font-weight: 700;
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--ax-dark-border);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: -0.17px;
            color: var(--ax-dark-fg-3);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            .main {
                margin-left: 0;
                padding: 24px;
            }
            body {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            .main {
                margin-left: 0;
                padding: 1.5rem;
            }
            body {
                flex-direction: column;
            }
        }
    </style>
</head>

    <script>
        function toggleSection(id) {
            const sub = document.getElementById('sub-' + id);
            const icon = document.getElementById('icon-' + id);
            sub.classList.toggle('open');
            icon.classList.toggle('open');
        }

        const tutorials = {
            plataforma: {
                bienvenido: {
                    title: '¡Bienvenido al portal!',
                    description: 'Guía completa de 80 pasos para usar el tablero de visualización de Asimetrix.',
                    content: `
                        <h2>Tutorial General de Know</h2>
                        <p>Guía completa de 80 pasos para usar el tablero de visualización de Asimetrix. Incluye navegación, filtros, exploración de datos y descarga.</p>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">1. Navegación básica</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 1: Click para ver las hojas disponibles en el tablero</div>
                            <p style="color:#41474e;margin-bottom:0;">Al entrar al tablero de visualización, verás las diferentes hojas (sheets) disponibles. Haz click en cualquiera para comenzar a explorar.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 2: Damos click en la hoja que queremos ver</div>
                            <p style="color:#41474e;margin-bottom:0;">Selecciona la hoja que deseas visualizar. Cada hoja contiene diferentes métricas y visualizaciones.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 3: ¿Cómo moverse en el tablero de visualización?</div>
                            <p style="color:#41474e;margin-bottom:0;">Usa las barras de desplazamiento o el ratón para navegar por el tablero. También puedes hacer zoom in/out.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 4: También podemos movernos por las hojas a través de las flechas</div>
                            <p style="color:#41474e;margin-bottom:0;">Usa las flechas de navegación (izquierda/derecha) en la parte superior para cambiar entre hojas del tablero.</p>
                        </div>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">2. Filtros</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 5: Sección de filtros que afectan todos los gráficos del tablero</div>
                            <p style="color:#41474e;margin-bottom:0;">En la parte superior encontrarás los filtros globales. Estos afectan a todos los gráficos y tablas del tablero actual.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 6: Damos click en el filtro</div>
                            <p style="color:#41474e;margin-bottom:0;">Haz click en cualquier filtro para desplegar las opciones disponibles.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 7: Seleccionamos los datos que queremos filtrar</div>
                            <p style="color:#41474e;margin-bottom:0;">Marca las casillas de los elementos que deseas incluir en el filtro. Puedes seleccionar múltiples.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 8: Damos click en el ícono de chulo para confirmar la selección</div>
                            <p style="color:#41474e;margin-bottom:0;">Una vez seleccionados los datos, haz click en el botón de confirmación (✓) para aplicar el filtro.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 9: Click aquí</div>
                            <p style="color:#41474e;margin-bottom:0;">Continúa configurando más filtros según sea necesario.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 10: Click aquí</div>
                            <p style="color:#41474e;margin-bottom:0;">Explora más opciones de filtrado haciendo click en los elementos correspondientes.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 11: Click "Feb."</div>
                            <p style="color:#41474e;margin-bottom:0;">Selecciona el mes o período de tiempo que deseas visualizar en los gráficos.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 12: Click "Mar."</div>
                            <p style="color:#41474e;margin-bottom:0;">Continúa seleccionando los meses o períodos que quieras comparar o analizar.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 13: Click "Abr."</div>
                            <p style="color:#41474e;margin-bottom:0;">Agrega más períodos de tiempo a tu selección para un análisis más completo.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 14: Damos click aquí para confirmar</div>
                            <p style="color:#41474e;margin-bottom:0;">Confirma la selección del período de tiempo haciendo click en el botón correspondiente.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 15: En la parte superior veremos los filtros que vamos haciendo</div>
                            <p style="color:#41474e;margin-bottom:0;">Podrás ver un resumen de todos los filtros aplicados en la parte superior del tablero.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 16: ¿Cómo seleccionar todos los datos, dejando solo uno por fuera?</div>
                            <p style="color:#41474e;margin-bottom:0;">Para seleccionar casi todos los elementos excepto uno, usa la opción "Seleccionar todo" y luego desmarca el que quieras excluir.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 17: Damos click en los datos que queremos filtrar</div>
                            <p style="color:#41474e;margin-bottom:0;">Marca los elementos que deseas incluir. Puedes usar las teclas Ctrl (Cmd en Mac) para selecciones múltiples.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 18: Damos click en los 3 puntos para más opciones</div>
                            <p style="color:#41474e;margin-bottom:0;">Accede a opciones avanzadas haciendo click en el menú de tres puntos (...).</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 19: Click "Select excluded"</div>
                            <p style="color:#41474e;margin-bottom:0;">Usa esta opción para seleccionar todos los elementos que NO quieres incluir en el filtro.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 20: Damos click aquí para confirmar</div>
                            <p style="color:#41474e;margin-bottom:0;">Confirma la selección de exclusión haciendo click en el botón de confirmación.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 21: Damos click aquí para devolvernos un paso en las selecciones</div>
                            <p style="color:#41474e;margin-bottom:0;">Si cometiste un error, usa el botón de retroceso para deshacer la última selección.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 22: Cada click nos devolverá un paso</div>
                            <p style="color:#41474e;margin-bottom:0;">Continúa haciendo click para retroceder paso a paso en tus selecciones.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 23: Damos click en la X en cada filtro para borrar todas las selecciones</div>
                            <p style="color:#41474e;margin-bottom:0;">Para limpiar completamente un filtro, haz click en la "X" para eliminar todas las selecciones y comenzar de nuevo.</p>
                        </div>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">3. Interacciones con gráficos</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 24: Interacciones al interior de las gráficas</div>
                            <p style="color:#41474e;margin-bottom:0;">Puedes interactuar directamente con los gráficos para explorar datos específicos y obtener detalles.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 25: Click aquí para cambiar la categoría que vemos en las lineas</div>
                            <p style="color:#41474e;margin-bottom:0;">Cambia la dimensión que se muestra en las líneas del gráfico haciendo click en las opciones correspondientes.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 26: Click en cualquier punto con datos para filtrar</div>
                            <p style="color:#41474e;margin-bottom:0;">Haz click directamente sobre un punto de datos en el gráfico para filtrar toda la información relacionada con ese punto.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 27: Una vez damos click en un punto de la gráfica se resalta toda la línea</div>
                            <p style="color:#41474e;margin-bottom:0;">Al seleccionar un punto, toda la serie de datos correspondiente se resaltará para facilitar su seguimiento.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 28: Con click sostenido podemos filtrar un período de tiempo</div>
                            <p style="color:#41474e;margin-bottom:0;">Mantén presionado el botón del ratón y arrastra sobre el gráfico para seleccionar un rango de tiempo específico.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 29: Damos click aquí para confirmar</div>
                            <p style="color:#41474e;margin-bottom:0;">Confirma la selección del rango de tiempo haciendo click en el botón correspondiente.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 30: Click en las flechas diagonales para aumentar el tamaño de las gráficas</div>
                            <p style="color:#41474e;margin-bottom:0;">Usa las esquinas del gráfico para expandirlo y ver los datos con mayor detalle.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 31: Click en la categoría de la derecha cambiará la forma como se agrupan las lineas</div>
                            <p style="color:#41474e;margin-bottom:0;">Cambia la agrupación de las series de datos haciendo click en las opciones de la derecha del gráfico.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 32: Click en la categoría de la izquierda cambiará los datos como se agrupa el eje X</div>
                            <p style="color:#41474e;margin-bottom:0;">Modifica la escala del eje X seleccionando diferentes categorías en el panel izquierdo.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 33: Click en la "X" para minimizar la gráfica</div>
                            <p style="color:#41474e;margin-bottom:0;">Minimiza o cierra el gráfico expandido haciendo click en la "X" en la esquina.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 34: Damos click aquí para borrar todos los filtros</div>
                            <p style="color:#41474e;margin-bottom:0;">Limpia todos los filtros aplicados de una sola vez haciendo click en este botón.</p>
                        </div>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">4. Navegación entre hojas</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 35: Damos click aquí para movernos una hoja a la derecha</div>
                            <p style="color:#41474e;margin-bottom:0;">Usa este botón para avanzar a la siguiente hoja del tablero.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 36: Damos click aquí para cambiar las unidades de métricas</div>
                            <p style="color:#41474e;margin-bottom:0;">Cambia entre diferentes unidades de medida (kg, lb, etc.) para las métricas mostradas.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 37: Click aquí para confirmar la selección</div>
                            <p style="color:#41474e;margin-bottom:0;">Confirma el cambio de unidades haciendo click en el botón de confirmación.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 38: Click en año para seleccionar período de tiempo</div>
                            <p style="color:#41474e;margin-bottom:0;">Selecciona un año específico para filtrar los datos por ese período temporal.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 39: Click en "2024"</div>
                            <p style="color:#41474e;margin-bottom:0;">Elige el año 2024 o cualquier otro año disponible en el filtro de tiempo.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 40: Damos click aquí para confirmar</div>
                            <p style="color:#41474e;margin-bottom:0;">Confirma la selección del año haciendo click en el botón correspondiente.</p>
                        </div>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">5. Descarga de datos</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 41: Descarga de datos</div>
                            <p style="color:#41474e;margin-bottom:0;">Accede a la función de descarga para exportar los datos del tablero.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 42: Damos click derecho para desplegar opciones</div>
                            <p style="color:#41474e;margin-bottom:0;">Haz click derecho sobre los datos para ver las opciones disponibles de exportación.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 43: Damos click en "Download" para descargar los datos</div>
                            <p style="color:#41474e;margin-bottom:0;">Selecciona la opción "Download" para iniciar la descarga de los datos en el formato deseado.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 44: Seleccionamos formato de descarga</div>
                            <p style="color:#41474e;margin-bottom:0;">Elige entre diferentes formatos: Excel (.xlsx), CSV, PDF, o imagen (.png, .jpg).</p>
                        </div>

                        <div style="background:#014469;color:#fff;padding:0.75rem 1rem;border-radius:0.5rem;margin:1.5rem 0;font-weight:700;font-size:16px;">6. Menú de exploración</div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 45: Navegar por el Menu de Exploracion</div>
                            <p style="color:#41474e;margin-bottom:0;">Accede al menú de exploración para analizar datos detallados y crear vistas personalizadas.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 46: Damos click derecho para desplegar opciones</div>
                            <p style="color:#41474e;margin-bottom:0;">Haz click derecho en el área de datos para ver más opciones de exploración.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 47: Damos click en "Exploration menu"</div>
                            <p style="color:#41474e;margin-bottom:0;">Entra al menú de exploración para acceder a herramientas avanzadas de análisis.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 48: Damos click aquí para desplegar las opciones de variables</div>
                            <p style="color:#41474e;margin-bottom:0;">Explora las diferentes variables disponibles para el análisis.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 49: Damos click aquí para ampliar las variables categóricas</div>
                            <p style="color:#41474e;margin-bottom:0;">Expande la lista de variables categóricas para ver todas las opciones disponibles.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 50: Damos click aquí para organizar las gráficas</div>
                            <p style="color:#41474e;margin-bottom:0;">Reorganiza la disposición de los gráficos según tus preferencias.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 51: Damos click aquí</div>
                            <p style="color:#41474e;margin-bottom:0;">Continúa configurando la organización de los elementos visuales.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 52: Damos click aquí para organizar de manera descendente o ascendente</div>
                            <p style="color:#41474e;margin-bottom:0;">Cambia el orden de los datos: de mayor a menor (descendente) o de menor a mayor (ascendente).</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 53: Click en "Peso Inicial(Kg)"</div>
                            <p style="color:#41474e;margin-bottom:0;">Selecciona esta métrica para organizar los datos por peso inicial.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 54: Damos click aquí para organizar de manera ascendente o descendente</div>
                            <p style="color:#41474e;margin-bottom:0;">Ajusta el orden de la métrica seleccionada según lo necesites.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 55: Damos click en "Presentation" para mas opciones de las gráficas</div>
                            <p style="color:#41474e;margin-bottom:0;">Accede al modo presentación para ver las gráficas en pantalla completa con más opciones.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 56: Damos click aquí para cambiar el sentido de la gráfica</div>
                            <p style="color:#41474e;margin-bottom:0;">Cambia la orientación o el tipo de visualización de la gráfica.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 57: Damos click aquí para cambiar el sentido de la gráfica</div>
                            <p style="color:#41474e;margin-bottom:0;">Experimenta con diferentes orientaciones y tipos de gráficos.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 58: Damos click en "Colors and legend" para cambiar colores</div>
                            <p style="color:#41474e;margin-bottom:0;">Personaliza los colores de las series de datos y la leyenda del gráfico.</p>
                        </div>

                        <div style="background:#f6fafb;border-left:4px solid #014469;padding:1rem;margin-bottom:1rem;border-radius:0 0.5rem 0.5rem 0;">
                            <div style="font-weight:700;color:#014469;font-size:16px;margin-bottom:0.25rem;">Paso 59: Damos click aquí para cerrar el menú de exploración</div>
                            <p style="color:#41474e;margin-bottom:0;">Una vez terminada la exploración, cierra el menú para volver al tablero principal.</p>

        function openIframe(event, url, title, description) {
            document.querySelectorAll('.nav-link, .nav-simple-link').forEach(el => el.classList.remove('active'));
            const btn = event && event.target ? event.target.closest('.nav-link, .nav-simple-link') : null;
            if (btn) btn.classList.add('active');
            document.getElementById('main-title').textContent = title || 'Tutorial';
            document.getElementById('tutorial-content').innerHTML = '<iframe src="' + url + '" style="width:100%;height:80vh;border:none;border-radius:0.5rem;"></iframe>';
        }

        function openTutorial(section, tutorialId) {
            document.querySelectorAll('.nav-link, .nav-simple-link').forEach(el => el.classList.remove('active'));
            const btn = document.querySelector('[data-section="' + section + '"][data-tutorial="' + tutorialId + '"]');
            if (btn) btn.classList.add('active');
            const data = tutorials[section][tutorialId];
            if (!data) return;
            document.getElementById('main-title').textContent = data.title;
            document.getElementById('tutorial-content').innerHTML = data.content;
        }

        function openSimple(id) {
            document.querySelectorAll('.nav-link, .nav-simple-link').forEach(el => el.classList.remove('active'));
            const btns = document.querySelectorAll('.nav-simple-link');
            btns.forEach(btn => {
                if (btn.textContent.trim().toLowerCase().includes(id.toLowerCase())) {
                    btn.classList.add('active');
                }
            });
            const data = simpleSections[id];
            if (!data) return;
            document.getElementById('main-title').textContent = data.title;
            document.getElementById('tutorial-content').innerHTML = data.content;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const firstLink = document.querySelector('.nav-link');
            if (firstLink) firstLink.click();
        });
